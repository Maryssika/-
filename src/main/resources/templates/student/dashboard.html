<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Мой дашборд</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="card bg-gradient-primary text-white mb-4 p-4" style="background: linear-gradient(120deg, #667eea, #764ba2);">
    <h1>Привет, <span th:text="${fullName}">Ученик</span>!</h1>
    <p>Твои персональные задания.</p>
  </div>
  <div class="row g-4 mb-4">
    <div class="col-md-4">
      <div class="card p-3">
        <h5><i class="bi bi-check-circle-fill text-success"></i> Выполнено</h5>
        <div class="display-6" th:text="${tasksCompleted} + '/' + ${tasksTotal}">0/0</div>
        <div class="progress mt-2">
          <div class="progress-bar" th:style="'width: ' + ${tasksTotal > 0 ? (tasksCompleted * 100 / tasksTotal) : 0} + '%'"></div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3">
        <h5><i class="bi bi-clock-history"></i> Время сегодня</h5>
        <div class="display-6" th:text="${studyMinutes} + ' мин'">0</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3">
        <h5><i class="bi bi-star-fill text-warning"></i> Звёзды</h5>
        <div class="display-6" th:text="${stars}">0</div>
      </div>
    </div>
  </div>
  <h3>Твои задания</h3>
  <div class="row g-4" th:if="${not #lists.isEmpty(personalizedTasks)}">
    <div class="col-md-6 col-lg-4" th:each="task : ${personalizedTasks}">
      <div class="card h-100">
        <div class="card-body">
          <h5 th:text="${task.title}"></h5>
          <p th:text="${task.description}"></p>
          <span class="badge bg-secondary" th:text="'Сложность '+${task.difficultyLevel}+'/5'"></span>
          <a th:href="@{/task/{id}(id=${task.id})}" class="btn btn-primary mt-3 w-100">Начать</a>
        </div>
      </div>
    </div>
  </div>
  <div th:unless="${not #lists.isEmpty(personalizedTasks)}" class="alert alert-info">🎉 Ты выполнил все задания! Отдохни или попроси учителя добавить новые.</div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
