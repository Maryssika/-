<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Панель родителя</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="card bg-gradient mb-4 p-4" style="background: linear-gradient(120deg, #ff9a9e, #fad0c4);"><h1>Привет, <span th:text="${parent.fullName}">Родитель</span>!</h1><a href="/parent/add-child" class="btn btn-light">➕ Привязать ребёнка</a></div>
  <div class="row g-4" th:if="${not #lists.isEmpty(childrenStats)}">
    <div class="col-md-4" th:each="entry : ${childrenStats}"><div class="card h-100"><div class="card-body"><h5 th:text="${entry.key.fullName}"></h5><p th:text="${entry.key.email}"></p><div class="progress mb-2"><div class="progress-bar" th:style="'width: ' + ${entry.value.tasksTotal > 0 ? (entry.value.tasksCompleted * 100 / entry.value.tasksTotal) : 0} + '%'"></div></div><p>Выполнено: <strong th:text="${entry.value.tasksCompleted}+'/'+${entry.value.tasksTotal}"></strong></p><a th:href="@{'/parent/child/' + ${entry.key.id}}" class="btn btn-outline-primary w-100">Подробнее</a></div></div></div>
  </div>
  <div th:unless="${not #lists.isEmpty(childrenStats)}" class="alert alert-warning">У вас пока нет привязанных детей.</div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
