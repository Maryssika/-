<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Профиль ученика</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="card p-4">
    <h1>Профиль ученика: <span th:text="${child.fullName}">Имя</span></h1>
    <p><strong>Email:</strong> <span th:text="${child.email}"></span></p>
    <p><strong>Тип нарушения:</strong> <span th:text="${child.disabilityType?.displayName ?: 'Не указан'}"></span></p>
    <h3 class="mt-4">Прогресс обучения</h3>
    <p>Выполнено заданий: <span th:text="${tasksCompleted}">0</span> из <span th:text="${tasksTotal}">0</span></p>
    <div class="progress mb-4">
      <div class="progress-bar" role="progressbar" th:style="'width: ' + (${tasksTotal} > 0 ? (${tasksCompleted} * 100 / ${tasksTotal}) : 0) + '%'"></div>
    </div>
    <h4>Список заданий</h4>
    <div th:if="${#lists.isEmpty(tasksWithStatus)}" class="alert alert-info">Нет заданий</div>
    <ul class="list-group" th:unless="${#lists.isEmpty(tasksWithStatus)}">
      <li th:each="item : ${tasksWithStatus}" class="list-group-item d-flex justify-content-between">
        <span th:text="${item.task.title}"></span>
        <span th:class="${item.completed} ? 'badge bg-success' : 'badge bg-secondary'" th:text="${item.completed} ? 'Выполнено' : 'Не выполнено'"></span>
      </li>
    </ul>
    <a href="/parent/dashboard" class="btn btn-primary mt-3">← Назад</a>
  </div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
