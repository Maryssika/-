<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Чат с [[${partner.fullName}]]</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .chat-container {
        display: flex;
        flex-direction: column;
        height: 75vh;
        background: #f4f6fa;
        border-radius: 1rem;
        padding: 1rem;
    }
    .messages-area {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }
    .message {
        max-width: 70%;
        padding: 0.5rem 1rem;
        border-radius: 1rem;
        word-wrap: break-word;
    }
    /* Синее сообщение (отправленное) – справа */
    .message-sent {
        background: #007bff;
        color: white;
        margin-left: auto;           /* прижимаем к правому краю */
        border-radius: 1rem 1rem 0 1rem;
    }
    /* Сообщение собеседника – слева */
    .message-received {
        background: #e9ecef;         /* светло-серый фон */
        color: black;
        margin-right: auto;          /* прижимаем к левому краю */
        border-radius: 1rem 1rem 1rem 0;
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .message-sender {
        font-size: 0.7rem;
        font-weight: bold;
        margin-bottom: 0.2rem;
        color: #6c757d;
    }
    .message-time {
        font-size: 0.65rem;
        text-align: right;
        margin-top: 0.25rem;
        opacity: 0.7;
    }
    .input-area {
        margin-top: 1rem;
        display: flex;
        gap: 0.5rem;
    }
    .input-area textarea {
        flex: 1;
        border-radius: 2rem;
        padding: 0.5rem 1rem;
        border: 1px solid #ddd;
        resize: none;
    }
  </style>
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="chat-container">
    <h4>Чат с <span th:text="${partner.fullName}"></span></h4>
    <div class="messages-area" id="messagesArea">
      <div th:if="${messages != null and !messages.empty}">
        <div th:each="msg : ${messages}"
             th:classappend="${msg.sender.email == currentUserEmail} ? 'message message-sent' : 'message message-received'">
          <!-- Имя собеседника показываем только для полученных сообщений -->
          <div th:if="${msg.sender.email != currentUserEmail}" class="message-sender" th:text="${msg.sender.fullName}"></div>
          <div th:text="${msg.content}"></div>
          <div class="message-time" th:text="${#temporals.format(msg.sentAt, 'dd.MM.yyyy HH:mm')}"></div>
        </div>
      </div>
      <div th:unless="${messages != null and !messages.empty}" class="text-center text-muted">
        Нет сообщений. Напишите первое.
      </div>
    </div>
    <form th:action="@{/chat/send}" method="post" class="input-area" id="chatForm">
      <input type="hidden" name="receiverId" th:value="${partner.id}">
      <textarea name="content" rows="1" placeholder="Введите сообщение..." required></textarea>
      <button type="submit" class="btn btn-primary rounded-pill">Отправить</button>
    </form>
  </div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script>
  // Прокрутка вниз при загрузке страницы
  window.onload = function() {
      var area = document.getElementById('messagesArea');
      if (area) area.scrollTop = area.scrollHeight;
  };

  // Прокрутка после отправки сообщения (чтобы сразу увидеть новое сообщение)
  document.getElementById('chatForm')?.addEventListener('submit', function() {
      setTimeout(function() {
          var area = document.getElementById('messagesArea');
          if (area) area.scrollTop = area.scrollHeight;
      }, 100);
  });
</script>
</body>
</html>
