<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Контакты</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="card p-4">
    <h1 class="text-center mb-4">Контакты</h1>
    <div class="row g-4">
      <div class="col-md-4"><div class="text-center"><i class="bi bi-telephone fs-1 text-primary"></i><h4>Телефон</h4><p>8 (800) 123-45-67</p><p>Бесплатно по России</p></div></div>
      <div class="col-md-4"><div class="text-center"><i class="bi bi-envelope fs-1 text-primary"></i><h4>Email</h4><p>support@ovz-platform.ru</p><p>partners@ovz-platform.ru</p></div></div>
      <div class="col-md-4"><div class="text-center"><i class="bi bi-geo-alt fs-1 text-primary"></i><h4>Адрес</h4><p>г. Москва, ул. Образовательная, д. 15</p><p>БЦ "Инклюзия", 5 этаж</p></div></div>
    </div>
    <div class="mt-4"><form><div class="mb-3"><label>Ваше имя</label><input type="text" class="form-control"></div><div class="mb-3"><label>Email</label><input type="email" class="form-control"></div><div class="mb-3"><label>Сообщение</label><textarea class="form-control" rows="3"></textarea></div><button type="submit" class="btn btn-primary">Отправить</button></form></div>
  </div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
