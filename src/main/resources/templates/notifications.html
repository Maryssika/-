<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Уведомления</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="card p-4"><h1>Уведомления</h1><div th:if="${#lists.isEmpty(notifications)}" class="alert alert-info">Нет новых уведомлений</div><div th:each="note : ${notifications}" class="border-bottom py-3"><div class="d-flex"><i class="bi bi-bell-fill me-2 text-primary"></i><div><strong th:text="${note.title}"></strong><p th:text="${note.message}"></p><small th:text="${#temporals.format(note.createdAt, 'dd.MM.yyyy HH:mm')}"></small></div></div></div><a href="/parent/dashboard" class="btn btn-secondary mt-3">Назад</a></div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
