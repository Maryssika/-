<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-5" style="max-width: 450px;">
  <div class="card p-4">
    <h2 class="text-center">Вход в систему</h2>
    <form th:action="@{/login}" method="post">
      <div class="mb-3"><label>Email</label><input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label>Пароль</label><input type="password" name="password" class="form-control" required></div>
      <div class="mb-3 form-check"><input type="checkbox" name="remember-me" class="form-check-input"><label class="form-check-label">Запомнить меня</label></div>
      <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>
    <div class="text-center mt-3"><a href="/forgot-password">Забыли пароль?</a> | <a href="/register">Регистрация</a></div>
  </div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
