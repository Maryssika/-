<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Назначить задание</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4" style="max-width: 500px;">
  <div class="card p-4"><h2>Назначить задание: <span th:text="${student.fullName}"></span></h2><form th:action="@{/teacher/assign-task}" method="post"><input type="hidden" name="studentId" th:value="${student.id}"><div class="mb-3"><label>Задание</label><select name="taskId" class="form-select" required><option th:each="t : ${tasks}" th:value="${t.id}" th:text="${t.title}"></option></select></div><button class="btn btn-primary">Назначить</button><a th:href="@{/teacher/student/{id}(id=${student.id})}" class="btn btn-secondary">Отмена</a></form></div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
