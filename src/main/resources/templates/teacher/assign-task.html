<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Назначить задание</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">OVZ Platform</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" th:href="@{/teacher/dashboard}">Панель</a>
      <a class="nav-link" th:href="@{/profile}">Профиль</a>
      <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="btn btn-link nav-link">Выйти</button>
      </form>
    </div>
  </div>
</nav>
<div class="container mt-4">
  <h2>Назначить задание ученику: <span th:text="${student.fullName}"></span></h2>
  <form th:action="@{/teacher/assign-task}" method="post">
    <input type="hidden" name="studentId" th:value="${student.id}">
    <div class="mb-3">
      <label for="taskId" class="form-label">Выберите задание</label>
      <select class="form-select" id="taskId" name="taskId" required>
        <option th:each="t : ${tasks}" th:value="${t.id}" th:text="${t.title}"></option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Назначить</button>
    <a th:href="@{/teacher/student/{id}(id=${student.id})}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
</body>
</html>
