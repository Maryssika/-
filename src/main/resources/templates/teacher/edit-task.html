<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Создать задание</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4" style="max-width: 800px;">
  <div class="card p-4"><h1>Новое задание</h1><form th:action="@{/teacher/create-task}" method="post"><div class="mb-3"><label>Название</label><input type="text" name="title" class="form-control" required></div><div class="mb-3"><label>Описание</label><textarea name="description" rows="3" class="form-control"></textarea></div><div class="mb-3"><label>Категория</label><select name="category" class="form-select"><option value="visual">Нарушение зрения</option><option value="hearing">Нарушение слуха</option><option value="motor">Нарушение моторики</option><option value="cognitive">Когнитивные</option></select></div><div class="mb-3"><label>Сложность (1-5)</label><input type="number" name="difficultyLevel" min="1" max="5" class="form-control"></div><div class="mb-3"><label>Медиа URL</label><input type="url" name="mediaUrl" class="form-control"></div><div class="mb-3"><label>Альтернативный текст</label><input type="text" name="alternativeText" class="form-control"></div><button type="submit" class="btn btn-primary">Сохранить</button></form></div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
