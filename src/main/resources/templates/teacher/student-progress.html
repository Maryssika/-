<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Прогресс ученика</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="card p-4"><h1>Прогресс: <span th:text="${student.fullName}"></span></h1><p>Email: <span th:text="${student.email}"></span></p><div class="row g-3"><div class="col"><div class="card p-2 text-center"><h4>Выполнено</h4><div class="display-6" th:text="${completed}">0</div></div></div><div class="col"><div class="card p-2 text-center"><h4>Всего</h4><div class="display-6" th:text="${total}">0</div></div></div></div><div class="progress mt-3"><div class="progress-bar" th:style="'width:' + (total>0? (completed*100/total) : 0) + '%'"></div></div><h3 class="mt-4">Список заданий</h3><ul class="list-group"><li th:each="item : ${tasksWithStatus}" class="list-group-item d-flex justify-content-between"><span th:text="${item.task.title}"></span><span th:class="${item.completed} ? 'badge bg-success' : 'badge bg-secondary'" th:text="${item.completed} ? 'Выполнено' : 'Не выполнено'"></span></li></ul><a href="/teacher/dashboard" class="btn btn-primary mt-3">Назад</a></div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
