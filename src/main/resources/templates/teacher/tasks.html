<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Список заданий</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="card p-4"><h1>Все задания</h1><div class="mb-3"><a href="/teacher/create-task" class="btn btn-primary">➕ Создать</a> <a href="/teacher/dashboard" class="btn btn-outline-secondary">Назад</a></div><div class="table-responsive-custom"><table class="table table-hover"><thead><tr><th>Название</th><th>Категория</th><th>Сложность</th><th>Действия</th></tr></thead><tbody><tr th:each="task : ${tasks}"><td th:text="${task.title}"></td><td th:text="${task.category}"></td><td th:text="${task.difficultyLevel}"></td><td><a th:href="@{/teacher/edit-task/{id}(id=${task.id})}" class="btn btn-sm btn-warning">✏️</a><form method="post" th:action="@{/teacher/delete-task/{id}(id=${task.id})}" class="d-inline"><button class="btn btn-sm btn-danger" onclick="return confirm('Удалить?')">🗑️</button></form></td></tr></tbody></table></div></div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
