<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Панель учителя</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="card mb-4">
    <div class="card-body">
      <h1>👋 Добро пожаловать, <span th:text="${teacher.fullName}">Учитель</span>!</h1>
      <div class="mt-3">
        <a href="/teacher/create-task" class="btn btn-primary me-2">➕ Создать задание</a>
        <a href="/teacher/tasks" class="btn btn-outline-secondary">📋 Список заданий</a>
        <a href="/chat" class="btn btn-outline-info ms-2">💬 Мои чаты</a>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">Мои ученики</div>
    <div class="card-body">
      <form method="post" th:action="@{/teacher/add-student}" class="row g-3 mb-4">
        <div class="col-auto"><input type="email" name="studentEmail" class="form-control" placeholder="Email ученика"></div>
        <div class="col-auto"><button class="btn btn-success">Добавить</button></div>
      </form>
      <div class="table-responsive-custom">
        <table class="table table-hover">
          <thead>
          <tr><th>ФИО</th><th>Email</th><th>Тип нарушения</th><th>Родитель</th><th>Действия</th></tr>
          </thead>
          <tbody>
          <tr th:each="student : ${students}">
            <td th:text="${student.fullName}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.disabilityType?.displayName ?: '—'}"></td>
            <td>
              <div th:if="${student.parent != null}">
                <span th:text="${student.parent.fullName}"></span><br>
                <small th:text="${student.parent.email}"></small>
                <a th:href="@{/chat/with/{id}(id=${student.parent.id})}" class="btn btn-sm btn-outline-primary ms-2">💬 Написать родителю</a>
              </div>
              <span th:unless="${student.parent != null}">—</span>
            </td>
            <td>
              <a th:href="@{/teacher/student/{id}(id=${student.id})}" class="btn btn-sm btn-info">Детали</a>
              <form method="post" th:action="@{/teacher/remove-student/{id}(id=${student.id})}" class="d-inline">
                <button class="btn btn-sm btn-danger" onclick="return confirm('Удалить?')">🗑️</button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
