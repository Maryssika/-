<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Мои диалоги</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="card p-4">
    <h1 class="mb-4">💬 Мои диалоги</h1>

    <div th:if="${partners != null and !partners.empty}">
      <div class="list-group">
        <a th:each="partner : ${partners}"
           th:href="@{/chat/with/{id}(id=${partner.id})}"
           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
          <div>
            <strong th:text="${partner.fullName}">Имя</strong><br>
            <small th:text="${partner.email}">email</small>
          </div>
          <i class="bi bi-chevron-right"></i>
        </a>
      </div>
    </div>
    <div th:unless="${partners != null and !partners.empty}" class="alert alert-info">
      🤝 У вас пока нет диалогов. Напишите кому-нибудь первым.
    </div>

    <a href="/teacher/dashboard" class="btn btn-secondary mt-3">← Назад</a>
  </div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
