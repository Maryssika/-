<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мой профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4" style="max-width: 600px;">
    <div class="card p-4">
        <h1>Мой профиль</h1>
        <div class="mb-3"><strong>Email:</strong> <span th:text="${user.email}"></span></div>
        <div class="mb-3"><strong>ФИО:</strong> <span th:text="${user.fullName}"></span></div>
        <div class="mb-3"><strong>Роль:</strong> <span th:text="${user.role.displayName}"></span></div>
        <div class="mb-3"><strong>Тип нарушения:</strong> <span th:text="${user.disabilityType?.displayName ?: 'Не указано'}"></span></div>
        <div class="mb-3"><strong>Высокий контраст:</strong> <span th:text="${user.accessibilityProfile?.highContrast ? 'Вкл' : 'Выкл'}"></span></div>
        <div class="mb-3"><strong>Размер шрифта:</strong> <span th:text="${user.accessibilityProfile?.fontSize ?: 'Средний'}"></span></div>
        <a href="/settings" class="btn btn-primary">Редактировать</a>
        <a th:href="@{${user.role.name() == 'STUDENT' ? '/student/dashboard' : (user.role.name() == 'TEACHER' ? '/teacher/dashboard' : (user.role.name() == 'PARENT' ? '/parent/dashboard' : '/'))}}" class="btn btn-secondary">Назад</a>
    </div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
