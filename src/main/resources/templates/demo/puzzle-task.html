<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Пазл | Собери картинку</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .puzzle-piece { width: 100px; height: 100px; border: 2px solid #dee2e6; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: grab; background: white; margin: 5px; }
    .puzzle-slot { width: 100px; height: 100px; border: 2px dashed #adb5bd; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #f8f9fa; }
    .puzzle-slot.filled { border-style: solid; border-color: var(--success); background: #d4edda; }
    .puzzle-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; justify-items: center; margin-top: 1rem; }
    .pieces-container { display: flex; flex-wrap: wrap; justify-content: center; margin-bottom: 2rem; }
  </style>
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="card p-4">
    <h1>🧩 Собери картинку</h1>
    <p class="lead">Перетащите кусочки пазла на поле в правильном порядке</p>
    <div class="pieces-container" id="piecesContainer"></div>
    <div class="puzzle-board" id="puzzleBoard"></div>
    <div class="mt-3 text-center"><button class="btn btn-primary" id="checkBtn">Проверить сборку</button> <button class="btn btn-outline-secondary" id="resetBtn">Начать заново</button></div>
    <div id="feedback" class="alert mt-3" style="display:none;"></div>
  </div>
</div>
<script>
  const pieces = [1,2,3,4,5,6,7,8,9];
  let currentOrder = [...pieces];
  let placed = new Array(9).fill(null);
  function shuffle(arr) { for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
  function render() {
      const piecesDiv = document.getElementById('piecesContainer');
      piecesDiv.innerHTML = '';
      currentOrder.forEach((num, idx) => {
          if(!placed.includes(num)) {
              const piece = document.createElement('div');
              piece.className = 'puzzle-piece';
              piece.draggable = true;
              piece.innerText = num;
              piece.setAttribute('data-value', num);
              piece.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', num));
              piecesDiv.appendChild(piece);
          }
      });
      const board = document.getElementById('puzzleBoard');
      board.innerHTML = '';
      for(let i=0;i<9;i++) {
          const slot = document.createElement('div');
          slot.className = 'puzzle-slot';
          if(placed[i]) { slot.classList.add('filled'); slot.innerText = placed[i]; }
          slot.setAttribute('data-index', i);
          slot.addEventListener('dragover', e => e.preventDefault());
          slot.addEventListener('drop', e => {
              e.preventDefault();
              const val = parseInt(e.dataTransfer.getData('text/plain'));
              const idx = parseInt(slot.dataset.index);
              if(placed[idx] === null) {
                  placed[idx] = val;
                  render();
              } else alert('Это место уже занято!');
          });
          board.appendChild(slot);
      }
      document.getElementById('feedback').style.display = 'none';
  }
  document.getElementById('checkBtn').addEventListener('click', () => {
      const isCorrect = placed.every((val, idx) => val === idx+1);
      const fb = document.getElementById('feedback');
      fb.style.display = 'block';
      if(isCorrect) { fb.className = 'alert alert-success'; fb.innerHTML = '🎉 Поздравляем! Пазл собран правильно!';
        setTimeout(() => { window.location.href = '/demo'; }, 2000);}
      else { fb.className = 'alert alert-danger'; fb.innerHTML = '❌ Неправильно. Попробуйте ещё раз.'; }
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
      currentOrder = shuffle([...pieces]);
      placed = new Array(9).fill(null);
      render();
  });
  render();
</script>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
