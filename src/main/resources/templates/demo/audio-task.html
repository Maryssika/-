<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Аудиальное задание</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .animal-card { border: 2px solid #dee2e6; border-radius: 1rem; padding: 1rem; text-align: center; cursor: pointer; transition: all 0.2s; }
    .animal-card:hover { border-color: var(--primary); background: #f0f7ff; transform: translateY(-3px); }
    .animal-card.selected { border-color: var(--primary); background: #e7f1ff; }
    .animal-card.correct { border-color: var(--success); background: #d4edda; }
    .animal-card.incorrect { border-color: var(--danger); background: #f8d7da; }
    .sound-button { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 2rem; padding: 0.75rem 2rem; font-size: 1.2rem; }
  </style>
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4" style="max-width: 800px;">
  <div class="card p-4">
    <h1>Угадай животное по звуку</h1>
    <p class="lead">Послушайте звук и выберите правильное животное</p>
    <div class="text-center my-3"><button class="sound-button" id="playBtn">🔊 Воспроизвести звук</button></div>
    <div class="row g-3" id="animals"></div>
    <div id="feedback" class="alert mt-3" style="display:none;"></div>
    <div class="mt-3">Очки: <span id="score">0</span>/3 | Вопрос <span id="qNum">1</span></div>
  </div>
</div>
<script>
  const questions = [{sound:'dog',correct:'dog',name:'Собака'},{sound:'cat',correct:'cat',name:'Кошка'},{sound:'bird',correct:'bird',name:'Птичка'}];
  let current = 0, score = 0, answered = false;
  const animals = ['dog','cat','cow','bird'];
  function render() {
      const container = document.getElementById('animals');
      container.innerHTML = animals.map(a => `<div class="col-md-3"><div class="animal-card" data-animal="${a}">${a==='dog'?'🐶 Собака':a==='cat'?'🐱 Кошка':a==='cow'?'🐮 Корова':'🐦 Птичка'}</div></div>`).join('');
      document.querySelectorAll('.animal-card').forEach(card => card.addEventListener('click', (e) => { if(!answered) selectAnimal(card.dataset.animal); }));
      document.getElementById('qNum').innerText = current+1;
      answered = false;
      document.getElementById('feedback').style.display = 'none';
      document.querySelectorAll('.animal-card').forEach(c => c.classList.remove('correct','incorrect','selected'));
  }
  function selectAnimal(animal) {
      const correct = questions[current].correct;
      const isCorrect = animal === correct;
      if(isCorrect) score++;
      document.getElementById('score').innerText = score;
      const feedback = document.getElementById('feedback');
      feedback.style.display = 'block';
      feedback.className = `alert ${isCorrect ? 'alert-success' : 'alert-danger'}`;
      feedback.innerHTML = isCorrect ? '✅ Правильно!' : `❌ Неправильно. Это был(а) ${questions[current].name}.`;
      document.querySelectorAll('.animal-card').forEach(c => {
          if(c.dataset.animal === correct) c.classList.add('correct');
          if(c.dataset.animal === animal && !isCorrect) c.classList.add('incorrect');
      });
      answered = true;
      setTimeout(() => {
          current++;
          if(current < questions.length) render();
          else alert(`Игра окончена! Очки: ${score}/${questions.length}`);
           window.location.href = '/demo';
      }, 1500);
  }
  document.getElementById('playBtn').addEventListener('click', () => {
      alert('🔊 Воспроизводится звук ' + questions[current].sound);
      speak(`Звук животного, вопрос ${current+1}`);
  });
  render();
</script>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
