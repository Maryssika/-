<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Сортировка по цвету</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .draggable {
      width: 80px; height: 80px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 2rem; margin: 5px; cursor: grab; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
    .draggable:active { cursor: grabbing; }
    .drop-zone {
      border: 2px solid #dee2e6; border-radius: 1rem; padding: 1rem; min-height: 150px;
      transition: all 0.2s; background: #f8f9fa;
    }
    .drop-zone.drag-over { border-color: var(--primary); background: #e9ecef; transform: scale(1.01); }
    /* Цветные ящики */
    .drop-zone[data-color="red"] { background: #ffe0e0; border-color: #dc3545; }
    .drop-zone[data-color="blue"] { background: #e0e5ff; border-color: #0d6efd; }
    .drop-zone[data-color="green"] { background: #e0ffe0; border-color: #198754; }
    .drop-zone[data-color="yellow"] { background: #fff8e0; border-color: #ffc107; }
    .badge-item { font-size: 1.2rem; margin: 3px; display: inline-block; }
  </style>
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="card p-4">
    <h1>🎨 Сортировка по цвету</h1>
    <p>Перетащите предметы в корзины нужного цвета</p>
    <div id="items" class="text-center my-3"></div>
    <div class="row g-3">
      <div class="col-md-3"><div class="drop-zone" data-color="red"><h5>🔴 Красный</h5><div class="zone-items" id="redItems"></div></div></div>
      <div class="col-md-3"><div class="drop-zone" data-color="blue"><h5>🔵 Синий</h5><div class="zone-items" id="blueItems"></div></div></div>
      <div class="col-md-3"><div class="drop-zone" data-color="green"><h5>🟢 Зелёный</h5><div class="zone-items" id="greenItems"></div></div></div>
      <div class="col-md-3"><div class="drop-zone" data-color="yellow"><h5>🟡 Жёлтый</h5><div class="zone-items" id="yellowItems"></div></div></div>
    </div>
    <div id="scoreDisplay" class="mt-3">✅ Перетащено: 0/6</div>
    <div class="mt-3 text-center">
      <a href="/demo" class="btn btn-secondary">← Назад к демо</a>
      <button id="resetBtn" class="btn btn-outline-primary ms-2">🔄 Начать заново</button>
    </div>
  </div>
</div>
<script>
  const items = [
    {id:1, color:'red', emoji:'🍎'},
    {id:2, color:'blue', emoji:'🔵'},
    {id:3, color:'green', emoji:'🌿'},
    {id:4, color:'yellow', emoji:'⭐'},
    {id:5, color:'red', emoji:'❤️'},
    {id:6, color:'blue', emoji:'💧'}
  ];
  let placedCount = 0;

  function renderItems() {
    const container = document.getElementById('items');
    container.innerHTML = '';
    items.forEach(item => {
      // Показываем только те предметы, которые ещё не перетащены (нет в зонах)
      if (!item.placed) {
        const el = document.createElement('div');
        el.className = 'draggable';
        el.draggable = true;
        el.style.backgroundColor = item.color;
        el.innerText = item.emoji;
        el.setAttribute('data-id', item.id);
        el.setAttribute('data-color', item.color);
        el.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', item.id));
        container.appendChild(el);
      }
    });
    // Очищаем зоны
    ['red','blue','green','yellow'].forEach(c => {
      const zoneDiv = document.getElementById(c+'Items');
      zoneDiv.innerHTML = '';
      // Отображаем уже положенные предметы
      items.filter(i => i.color === c && i.placed).forEach(i => {
        const badge = document.createElement('span');
        badge.className = 'badge-item';
        badge.innerText = i.emoji;
        zoneDiv.appendChild(badge);
      });
    });
    updateScore();
  }

  function updateScore() {
    placedCount = items.filter(i => i.placed).length;
    document.getElementById('scoreDisplay').innerHTML = `✅ Перетащено: ${placedCount}/6`;
    if (placedCount === 6) {
      setTimeout(() => {
        alert('🎉 Поздравляем! Все предметы рассортированы правильно!');
        // Не делаем авторедирект, остаёмся на странице – пользователь сам перейдёт по кнопке "Назад"
      }, 50);
    }
  }

  function resetGame() {
    items.forEach(i => i.placed = false);
    placedCount = 0;
    renderItems();
  }

  document.querySelectorAll('.drop-zone').forEach(zone => {
    zone.addEventListener('dragover', e => e.preventDefault());
    zone.addEventListener('dragenter', e => zone.classList.add('drag-over'));
    zone.addEventListener('dragleave', e => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const itemId = parseInt(e.dataTransfer.getData('text/plain'));
      const item = items.find(i => i.id === itemId);
      if (!item || item.placed) return;
      const expectedColor = zone.dataset.color;
      if (item.color === expectedColor) {
        item.placed = true;
        renderItems();
      } else {
        alert('❌ Неправильный цвет! Попробуй ещё раз.');
      }
    });
  });

  document.getElementById('resetBtn').addEventListener('click', resetGame);

  // Инициализация
  items.forEach(i => i.placed = false);
  renderItems();
</script>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
