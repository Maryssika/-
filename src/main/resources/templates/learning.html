<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Начать обучение</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="hero text-center p-5 rounded-4 mb-4" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white;">
    <h1 class="display-5">Начните обучение</h1>
    <p class="lead">Персонализированная программа для вашего ребёнка</p>
    <a href="/register" class="btn btn-light btn-lg mt-3">Зарегистрироваться</a>
  </div>
  <div class="row g-4">
    <div class="col-md-4"><div class="card h-100 text-center p-3"><i class="bi bi-1-circle fs-1 text-primary"></i><h3>Регистрация</h3><p>Укажите данные ребёнка и его особенности</p></div></div>
    <div class="col-md-4"><div class="card h-100 text-center p-3"><i class="bi bi-2-circle fs-1 text-primary"></i><h3>Настройка профиля</h3><p>Подберите адаптивный интерфейс</p></div></div>
    <div class="col-md-4"><div class="card h-100 text-center p-3"><i class="bi bi-3-circle fs-1 text-primary"></i><h3>Обучение</h3><p>Получите доступ к заданиям и отслеживайте прогресс</p></div></div>
  </div>
  <div class="mt-4 text-center"><a href="/demo" class="btn btn-outline-primary">Попробовать демо</a></div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
