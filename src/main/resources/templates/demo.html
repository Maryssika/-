<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Демоверсия</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .category-selector { border: 2px solid #e9ecef; border-radius: 1rem; padding: 1rem; cursor: pointer; transition: all 0.2s; }
    .category-selector.active, .category-selector:hover { border-color: var(--primary); background: #f0f7ff; }
  </style>
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="hero bg-gradient p-5 rounded-4 text-center mb-4" style="background: linear-gradient(135deg, #667eea, #764ba2); color: black; text-shadow: none;">
    <h1 class="display-5 fw-bold">Попробуйте демоверсию бесплатно</h1>
    <p class="lead">Ознакомьтесь с возможностями платформы без регистрации</p>
  </div>
  <div class="row g-3 mb-4" id="categoryRow">
    <div class="col-md-3"><div class="category-selector active text-center" data-cat="vision">👁️ Нарушения зрения<br><small>Аудио, контраст</small></div></div>
    <div class="col-md-3"><div class="category-selector text-center" data-cat="hearing">👂 Нарушения слуха<br><small>Визуал, субтитры</small></div></div>
    <div class="col-md-3"><div class="category-selector text-center" data-cat="motor">✋ Нарушения моторики<br><small>Крупные элементы</small></div></div>
    <div class="col-md-3"><div class="category-selector text-center" data-cat="cognitive">🧠 Когнитивные особенности<br><small>Четкие инструкции</small></div></div>
  </div>
  <div class="row g-4" id="tasksContainer"></div>
  <div class="mt-4 text-center"><a href="/start-learning" class="btn btn-primary btn-lg">Начать полное обучение</a></div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script>
  const tasksData = {
      vision: [{ icon:"🔊", title:"Угадай животное", link:"/demo/audio-task" },{ icon:"🎨", title:"Тактильное восприятие", link:"/demo/texture-task" },{ icon:"🧩", title:"Звуковой пазл", link:"/demo/sound-puzzle" }],
      hearing: [{ icon:"👁️", title:"Найди пару", link:"/demo/visual-match" },{ icon:"🎭", title:"Пантомима", link:"/demo/pantomime" },{ icon:"🔤", title:"Субтитры", link:"/demo/subtitles" }],
      motor: [{ icon:"🎯", title:"Клик по мишени", link:"/demo/target-click" },{ icon:"🖱️", title:"Drag-and-drop", link:"/demo/simple-drag" },{ icon:"⌨️", title:"Набор текста", link:"/demo/keyboard" }],
      cognitive: [{ icon:"🗂️", title:"Сортировка", link:"/demo/categorization" },{ icon:"🔢", title:"Последовательность", link:"/demo/sequence" },{ icon:"🎮", title:"Повтори узор", link:"/demo/pattern" }]
  };
  function loadCategory(cat) {
      const tasks = tasksData[cat];
      const container = document.getElementById('tasksContainer');
      container.innerHTML = tasks.map(t => `<div class="col-md-4"><div class="card h-100 text-center p-3"><div class="display-1">${t.icon}</div><h4>${t.title}</h4><a href="${t.link}" class="btn btn-outline-primary mt-3">Попробовать</a></div></div>`).join('');
  }
  document.querySelectorAll('.category-selector').forEach(el => {
      el.addEventListener('click', function() {
          document.querySelectorAll('.category-selector').forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          loadCategory(this.dataset.cat);
      });
  });
  loadCategory('vision');
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
