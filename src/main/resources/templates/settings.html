<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Настройки</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4" style="max-width: 600px;">
  <div class="card p-4"><h1>Настройки</h1><form method="post" th:action="@{/settings/update}"><div class="mb-3"><label>ФИО</label><input type="text" name="fullName" class="form-control" th:value="${user.fullName}"></div><div class="mb-3"><label>Новый пароль</label><input type="password" name="newPassword" class="form-control"></div><div class="mb-3"><label>Подтверждение пароля</label><input type="password" name="confirmPassword" class="form-control"></div><hr><div class="form-check mb-2"><input type="checkbox" name="highContrast" class="form-check-input" th:checked="${user.accessibilityProfile?.highContrast}"><label>Высокий контраст</label></div><div class="mb-3"><label>Размер шрифта</label><select name="fontSize" class="form-select"><option value="small">Мелкий</option><option value="medium" selected>Средний</option><option value="large">Крупный</option><option value="x-large">Очень крупный</option></select></div><button type="submit" class="btn btn-primary">Сохранить</button></form></div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
