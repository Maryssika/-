<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${userId != null ? 'Редактирование пользователя' : 'Создание пользователя'}">Форма пользователя</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4" style="max-width: 600px;">
  <div class="card p-4">
    <h1 th:text="${userId != null ? 'Редактирование пользователя' : 'Создание пользователя'}"></h1>
    <form th:action="@{${userId != null ? '/admin/users/update/' + userId : '/admin/users/create'}}" th:object="${userDto}" method="post">
      <div class="mb-3"><label class="form-label">Email</label><input type="email" th:field="*{email}" class="form-control" required><div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></div></div>
      <div class="mb-3"><label class="form-label">ФИО</label><input type="text" th:field="*{fullName}" class="form-control" required><div th:if="${#fields.hasErrors('fullName')}" class="text-danger" th:errors="*{fullName}"></div></div>
      <div class="mb-3"><label class="form-label">Пароль (оставьте пустым, чтобы не менять)</label><input type="password" th:field="*{password}" class="form-control"><div th:if="${#fields.hasErrors('password')}" class="text-danger" th:errors="*{password}"></div></div>
      <div class="mb-3"><label class="form-label">Подтверждение пароля</label><input type="password" th:field="*{confirmPassword}" class="form-control"><div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger" th:errors="*{confirmPassword}"></div></div>
      <div class="mb-3"><label class="form-label">Роль</label><select th:field="*{role}" class="form-select" required><option value="">Выберите роль</option><option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.displayName}"></option></select><div th:if="${#fields.hasErrors('role')}" class="text-danger" th:errors="*{role}"></div></div>
      <div class="mb-3"><label class="form-label">Тип нарушения (для ученика)</label><select th:field="*{disabilityType}" class="form-select"><option value="">Не указано</option><option th:each="dt : ${disabilityTypes}" th:value="${dt.name()}" th:text="${dt.displayName}"></option></select></div>
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="/admin/dashboard" class="btn btn-secondary">Отмена</a>
    </form>
  </div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
