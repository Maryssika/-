<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Редактирование задания</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Навигация (админская) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">OVZ Platform</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/admin/dashboard}">Панель</a>
            <a class="nav-link" th:href="@{/admin/tasks}">Все задания</a>
            <a class="nav-link" th:href="@{/profile}">Профиль</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn btn-link nav-link">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 th:text="${task.id == null ? 'Создание задания' : 'Редактирование задания'}">Форма задания</h1>

    <!-- ОДНА форма с поддержкой загрузки файлов -->
    <form th:action="@{${task.id == null} ? '/admin/tasks/create' : '/admin/tasks/update/' + ${task.id}}"
          method="post" enctype="multipart/form-data">

        <input type="hidden" name="id" th:value="${task.id}">

        <div class="mb-3">
            <label for="title" class="form-label">Название</label>
            <input type="text" class="form-control" id="title" name="title" th:value="${task.title}" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Описание</label>
            <textarea class="form-control" id="description" name="description" rows="3" th:text="${task.description}"></textarea>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Категория (тип нарушения)</label>
            <select class="form-select" id="category" name="category">
                <option value="">Выберите категорию</option>
                <option th:each="type : ${disabilityTypes}"
                        th:value="${type.name().toLowerCase()}"
                        th:text="${type.displayName}"
                        th:selected="${type.name().toLowerCase() == task.category}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label for="difficultyLevel" class="form-label">Уровень сложности (1–5)</label>
            <input type="number" class="form-control" id="difficultyLevel" name="difficultyLevel"
                   th:value="${task.difficultyLevel}" min="1" max="5">
        </div>

        <!-- Поле для загрузки изображения -->
        <div class="mb-3">
            <label for="imageFile" class="form-label">Изображение</label>
            <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*">
            <!-- Если уже есть картинка, показываем её и чекбокс для удаления -->
            <div th:if="${task.mediaUrl}" class="mt-2">
                <small>Текущее: <a th:href="${task.mediaUrl}" target="_blank">просмотр</a></small><br>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="removeImage" value="true" id="removeImage">
                    <label class="form-check-label" for="removeImage">Удалить изображение</label>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label for="alternativeText" class="form-label">Альтернативный текст (для скринридеров)</label>
            <input type="text" class="form-control" id="alternativeText" name="alternativeText"
                   th:value="${task.alternativeText}">
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a th:href="@{/admin/tasks}" class="btn btn-secondary">Отмена</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
