<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${task.id == null ? 'Создание задания' : 'Редактирование задания'}">Форма задания</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4" style="max-width: 800px;">
    <div class="card p-4">
        <h1 th:text="${task.id == null ? '➕ Создание задания' : '✏️ Редактирование задания'}"></h1>
        <form th:action="@{${task.id == null} ? '/admin/tasks/create' : '/admin/tasks/update/' + ${task.id}}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="id" th:value="${task.id}">
            <div class="mb-3"><label class="form-label">Название</label><input type="text" name="title" class="form-control" th:value="${task.title}" required></div>
            <div class="mb-3"><label class="form-label">Описание</label><textarea name="description" rows="3" class="form-control" th:text="${task.description}"></textarea></div>
            <div class="mb-3"><label class="form-label">Категория (тип нарушения)</label><select name="category" class="form-select"><option value="">Выберите</option><option th:each="type : ${disabilityTypes}" th:value="${type.name().toLowerCase()}" th:text="${type.displayName}" th:selected="${type.name().toLowerCase() == task.category}"></option></select></div>
            <div class="mb-3"><label class="form-label">Сложность (1–5)</label><input type="number" name="difficultyLevel" class="form-control" th:value="${task.difficultyLevel}" min="1" max="5"></div>
            <div class="mb-3"><label class="form-label">Изображение (URL)</label><input type="url" name="mediaUrl" class="form-control" th:value="${task.mediaUrl}"></div>
            <div class="mb-3"><label class="form-label">Альтернативный текст</label><input type="text" name="alternativeText" class="form-control" th:value="${task.alternativeText}"></div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="/admin/tasks" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
