<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${task.title}">Задание</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{fragments/nav :: nav}"></th:block>
<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-transparent"><h1 th:text="${task.title}"></h1><div><span class="badge bg-secondary" th:text="'Сложность '+${task.difficultyLevel}+'/5'"></span> <span class="badge bg-info" th:text="${task.category}"></span></div></div>
    <div class="card-body">
      <div class="p-3 bg-light rounded mb-4" th:text="${task.description}"></div>
      <div th:if="${task.mediaUrl}" class="text-center mb-4"><img th:src="${task.mediaUrl}" th:alt="${task.alternativeText}" class="img-fluid rounded"></div>
      <div class="bg-light p-4 rounded"><h3>Твой ответ</h3><form th:action="@{/task/{id}/answer(id=${task.id})}" method="post"><div class="mb-3"><label>Ответ</label><input type="text" name="answer" class="form-control" required></div><button type="submit" class="btn btn-primary">Отправить</button></form></div>
    </div>
    <div class="card-footer d-flex justify-content-between"><a href="javascript:history.back()" class="btn btn-outline-secondary">← Назад</a><a th:if="${nextTaskId}" th:href="@{/task/{id}(id=${nextTaskId})}" class="btn btn-primary">Следующее</a></div>
  </div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/global.js}"></script>
</body>
</html>
